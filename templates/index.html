<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Homes — AI Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='16' width='100' height='100' fill='%23c8a45c'/><text x='50' y='68' text-anchor='middle' font-size='52' font-weight='bold' fill='%230f2b46'>N</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">
                <div class="logo-icon">N</div>
                <div>
                    <h1>Northstar Homes</h1>
                    <span class="subtitle">AI Sales Assistant</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="showAnalytics()">Analytics</button>
                <button class="btn-secondary" onclick="clearChat()">New Chat</button>
            </div>
        </header>

        <main>
            <div id="chat-area">
                <div id="messages"></div>
                <div id="typing" class="typing hidden">
                    <div class="bot-avatar">N</div>
                    <div class="bubble bot-bubble">
                        Typing<span class="typing-dots"><span></span><span></span><span></span></span>
                    </div>
                </div>
            </div>

            <form id="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="user-input" placeholder="Type your message in English, Hindi, or Hinglish..." autocomplete="off">
                <button type="submit" id="send-btn">Send</button>
            </form>
        </main>

        <div id="analytics-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Conversation Analytics</h2>
                    <button class="close-btn" onclick="hideAnalytics()">&times;</button>
                </div>
                <div id="analytics-body"></div>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let conversationStart = Date.now();

        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("user-input");
        const typingEl = document.getElementById("typing");
        const sendBtn = document.getElementById("send-btn");

        function escapeHtml(text) {
            const d = document.createElement("div");
            d.textContent = text;
            return d.innerHTML;
        }

        function addUserMessage(text) {
            const div = document.createElement("div");
            div.className = "message user-message";
            div.style.animation = "msgIn 0.3s ease-out";
            div.innerHTML = `<div class="bubble user-bubble">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function createBotMessage() {
            const div = document.createElement("div");
            div.className = "message bot-message";
            div.style.animation = "msgIn 0.3s ease-out";
            div.innerHTML = `
                <div class="bot-avatar">N</div>
                <div class="bubble bot-bubble"></div>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div.querySelector(".bubble");
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = inputEl.value.trim();
            if (!text) return;

            addUserMessage(text);
            chatHistory.push({ role: "user", content: text });
            inputEl.value = "";
            inputEl.focus();

            typingEl.classList.remove("hidden");
            messagesEl.scrollTop = messagesEl.scrollHeight;
            sendBtn.disabled = true;

            const botBubble = createBotMessage();
            let fullReply = "";

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: chatHistory }),
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        try {
                            const event = JSON.parse(line.slice(6));

                            if (event.type === "token") {
                                fullReply += event.content;
                                botBubble.textContent = fullReply;
                                messagesEl.scrollTop = messagesEl.scrollHeight;
                            }

                            if (event.type === "done") {
                                fullReply = event.reply;
                                botBubble.textContent = fullReply;
                                chatHistory.push({ role: "assistant", content: fullReply });
                            }
                        } catch {}
                    }
                }
            } catch (err) {
                botBubble.textContent = "Sorry, something went wrong. Please try again.";
            }

            typingEl.classList.add("hidden");
            sendBtn.disabled = false;
        }

        async function showAnalytics() {
            if (chatHistory.length === 0) {
                alert("Start a conversation first to see analytics.");
                return;
            }

            try {
                const res = await fetch("/api/analytics", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: chatHistory }),
                });
                const data = await res.json();
                renderAnalytics(data.analytics);
                document.getElementById("analytics-modal").classList.remove("hidden");
            } catch (err) {
                alert("Could not generate analytics.");
            }
        }

        function renderAnalytics(a) {
            const body = document.getElementById("analytics-body");
            const duration = Math.round((Date.now() - conversationStart) / 1000);
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;

            function badge(val, high, low) {
                if (high.includes(val)) return `<span class="badge b-green">${val}</span>`;
                if (low.includes(val)) return `<span class="badge b-red">${val}</span>`;
                return `<span class="badge b-yellow">${val}</span>`;
            }

            body.innerHTML = `
                <div class="analytics-grid">
                    <div class="stat-card">
                        <label>Customer Name</label>
                        <span class="stat-value">${a.customer_name || "Not provided"}</span>
                    </div>
                    <div class="stat-card">
                        <label>Interest Level</label>
                        ${badge(a.interest_level, ["high"], ["low", "none"])}
                    </div>
                    <div class="stat-card">
                        <label>Configuration</label>
                        <span class="stat-value">${a.configuration}</span>
                    </div>
                    <div class="stat-card">
                        <label>Budget</label>
                        <span class="stat-value">${a.budget}</span>
                    </div>
                    <div class="stat-card">
                        <label>Site Visit</label>
                        ${a.site_visit_booked ? '<span class="badge b-green">Booked</span>' : '<span class="badge b-red">Not booked</span>'}
                    </div>
                    <div class="stat-card">
                        <label>Sentiment</label>
                        ${badge(a.sentiment, ["positive"], ["negative"])}
                    </div>
                    <div class="stat-card">
                        <label>Follow-up Needed</label>
                        ${a.follow_up_needed ? '<span class="badge b-yellow">Yes</span>' : '<span class="badge b-green">No</span>'}
                    </div>
                    <div class="stat-card">
                        <label>Human Agent Requested</label>
                        ${a.wants_human_agent ? '<span class="badge b-yellow">Yes</span>' : '<span class="badge b-green">No</span>'}
                    </div>
                    <div class="stat-card">
                        <label>Stop Communication</label>
                        ${a.stop_communication ? '<span class="badge b-red">Yes</span>' : '<span class="badge b-green">No</span>'}
                    </div>
                    <div class="stat-card">
                        <label>Messages</label>
                        <span class="stat-value">${a.customer_messages}</span>
                    </div>
                    <div class="stat-card">
                        <label>Duration</label>
                        <span class="stat-value">${minutes}m ${seconds}s</span>
                    </div>
                </div>
            `;
        }

        function hideAnalytics() {
            document.getElementById("analytics-modal").classList.add("hidden");
        }

        function clearChat() {
            chatHistory = [];
            messagesEl.innerHTML = "";
            conversationStart = Date.now();
            addMessage("bot", "Welcome to Northstar Homes! I'm your AI sales assistant. How can I help you today? Are you interested in learning about our projects in Gurugram?");
        }

        function addMessage(role, text) {
            if (role === "user") {
                addUserMessage(text);
            } else {
                const bubble = createBotMessage();
                bubble.textContent = text;
            }
        }

        addMessage("bot", "Welcome to Northstar Homes! I'm your AI sales assistant. How can I help you today? Are you interested in learning about our projects in Gurugram?");
    </script>
</body>
</html>
